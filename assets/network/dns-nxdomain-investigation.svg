ont-weight="800" text-anchor="middle">NXDOMAIN</text><text x="590" y="492" fill="#c3d9e3" font-size="16" font-weight="700" text-anchor="middle">+24.2 s</text><text x="590" y="519" fill="#a7bfce" font-size="13" font-weight="550" text-anchor="middle">bad-3.invalid</text><text x="590" y="541" fill="#7da0b0" font-size="13" font-weight="450" text-anchor="middle">192.0.2.10</text><rect x="724" y="314" width="148" height="146" rx="12" fill="#3a4e54" stroke="#bd986d"/><text x="798" y="345" fill="#ffcc91" font-size="15" font-weight="800" text-anchor="middle">NXDOMAIN</text><text x="798" y="492" fill="#c3d9e3" font-size="16" font-weight="700" text-anchor="middle">+36.2 s</text><text x="798" y="519" fill="#a7bfce" font-size="13" font-weight="550" text-anchor="middle">bad-4.invalid</text><text x="798" y="541" fill="#7da0b0" font-size="13" font-weight="450" text-anchor="middle">192.0.2.10</text><rect x="932" y="401" width="148" height="59" rx="12" fill="#215d55" stroke="#5cbb9a"/><text x="1006" y="432" fill="#a5f3dc" font-size="15" font-weight="800" text-anchor="middle">NOERROR</text><text x="1006" y="492" fill="#c3d9e3" font-size="16" font-weight="700" text-anchor="middle">+48.2 s</text><text x="1006" y="519" fill="#a7bfce" font-size="13" font-weight="550" text-anchor="middle">portal.example</text><text x="1006" y="541" fill="#7da0b0" font-size="13" font-weight="450" text-anchor="middle">192.0.2.11</text><line x1="79" y1="462" x2="1113" y2="462" stroke="#527286" stroke-width="1" /><text x="84" y="578" fill="#b5d1dd" font-size="14" font-weight="550" >4th NXDOMAIN at +36.2s triggers review for 192.0.2.10; normal reply belongs to a different client.</text><line x1="57" y1="637" x2="1138" y2="637" stroke="#355365" stroke-width="1" /><text x="58" y="667" fill="#7fa4b6" font-size="13" font-weight="600" >SYNTHETIC DNS / PAIRED QUERY–RESPONSE / 4 MATCHES OVER 36.2s</text><text x="1135" y="667" fill="#7fa4b6" font-size="13" font-weight="600" text-anchor="end">OFFLINE VISUALIZATION • NOT