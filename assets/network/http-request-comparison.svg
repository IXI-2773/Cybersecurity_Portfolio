<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Offline synthetic HTTP comparison: normal GET and flagged POST request">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#112a3a"/></linearGradient><linearGradient id="acc" x2="1"><stop stop-color="#55dcc7"/><stop offset="1" stop-color="#8cbcef"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#214052" stroke-opacity=".25" stroke-width="1"/></pattern></defs>
<rect width="1200" height="700" fill="url(#bg)"/><rect width="1200" height="700" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="58" y="66" fill="#5fdec6" font-size="16" font-weight="800" letter-spacing="2">DON LOPEZ / NETWORK INVESTIGATION</text><text x="58" y="127" fill="#eaf7fb" font-size="46" font-weight="800" >HTTP • compare two client requests</text><text x="59" y="166" fill="#a2bece" font-size="18" font-weight="400" >Five synthetic TCP packets per session including handshake and response</text><rect x="58" y="205" width="528" height="396" rx="20" fill="#0b1e2b" stroke="#395669"/><text x="85" y="252" fill="#64e0c6" font-size="15" font-weight="800" letter-spacing="1">REFERENCE / BENIGN CONTROL</text><rect x="85" y="274" width="102" height="50" rx="10" fill="#0d312e" stroke="#64e0c6"/><text x="136" y="307" fill="#64e0c6" font-size="26" font-weight="800" text-anchor="middle">GET</text><text x="206" y="305" fill="#c7dce6" font-size="18" font-weight="650" >12:01:00.030 UTC</text><rect x="84" y="347" width="472" height="190" rx="13" fill="#122c3b" stroke="#264b61"/><text x="102" y="386" fill="#7da5ba" font-size="13" font-weight="800" >SOURCE</text><text x="102" y="414" fill="#edf7fb" font-size="22" font-weight="750" >192.0.2.11</text><text x="102" y="450" fill="#7da5ba" font-size="13" font-weight="800" >DESTINATION</text><text x="102" y="478" fill="#edf7fb" font-size="21" font-weight="700" >203.0.113.80:80</text><text x="102" y="510" fill="#64e0c6" font-size="15" font-weight="620" >Host: portal.example    Path: /index.html</text><text x="85" y="579" fill="#64e0c6" font-size="17" font-weight="760" >Reference request</text><rect x="610" y="205" width="528" height="396" rx="20" fill="#0b1e2b" stroke="#395669"/><text x="637" y="252" fill="#ffd096" font-size="15" font-weight="800" letter-spacing="1">REVIEW CANDIDATE</text><rect x="637" y="274" width="102" height="50" rx="10" fill="#3b3026" stroke="#ffd096"/><text x="688" y="307" fill="#ffd096" font-size="26" font-weight="800" text-anchor="middle">POST</text><text x="758" y="305" fill="#c7dce6" font-size="18" font-weight="650" >12:01:15.030 UTC</text><rect x="636" y="347" width="472" height="190" rx="13" fill="#122c3b" stroke="#264b61"/><text x="654" y="386" fill="#7da5ba" font-size="13" font-weight="800" >SOURCE</text><text x="654" y="414" fill="#edf7fb" font-size="22" font-weight="750" >192.0.2.10</text><text x="654" y="450" fill="#7da5ba" font-size="13" font-weight="800" >DESTINATION</text><text x="654" y="478" fill="#edf7fb" font-size="21" font-weight="700" >203.0.113.80:80</text><text x="654" y="510" fill="#ffd096" font-size="15" font-weight="620" >Host: collector.invalid    Path: /upload</text><text x="637" y="579" fill="#ffd096" font-size="17" font-weight="760" >Flagged for triage only</text><line x1="57" y1="637" x2="1138" y2="637" stroke="#355365" stroke-width="1" /><text x="58" y="667" fill="#7fa4b6" font-size="13" font-weight="600" >SYNTHETIC HTTP / RESERVED DOMAINS / NO REAL TRANSFER OR INCIDENT</text><text x="1135" y="667" fill="#7fa4b6" font-size="13" font-weight="600" text-anchor="end">OFFLINE VISUALIZATION • NOT WIRESHARK</text></g>
</svg>