<circle cx="769.3" cy="376" r="10" fill="#f4b86b" stroke="#071820" stroke-width="4"/><text x="769.3" y="344" class="time" text-anchor="middle">16:07Z</text><text x="769.3" y="414" class="event" text-anchor="middle">Sign-in</text>
