<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="case-title case-desc">
<title id="case-title">Enterprise account investigation</title>
<desc id="case-desc">Evidence summary for LAB-ID-001: Completed event correlation</desc>
<style>.label{font:700 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.6px}.title{font:800 40px Inter,Segoe UI,Arial,sans-serif}.status{font:500 17px Inter,Segoe UI,Arial,sans-serif}.metric{font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#75e0ca}.metric-label{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#b7ced3;letter-spacing:.6px}.section{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#8db1b9;letter-spacing:1px}.time{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#cce0e4}.event{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#a9c1c7}.finding-id{font:800 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#75e0ca}.finding{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#eaf4f2}.severity{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#f4c686;letter-spacing:1px}</style>
<rect width="1200" height="628" fill="#071820"/>
<text x="56" y="54" class="label" fill="#63d4bc">DON LOPEZ / LAB-ID-001</text>
<text x="56" y="112" class="title" fill="#f3faf8">Enterprise account investigation</text>
<text x="56" y="148" class="status" fill="#a8c2c7">Completed event correlation</text>
<rect x="56.0" y="174" width="332.7" height="106" rx="12" fill="#102f3a" stroke="#315460"/><text x="78.0" y="222" class="metric">6</text><text x="78.0" y="252" class="metric-label">Events reviewed</text>
<rect x="402.7" y="174" width="332.7" height="106" rx="12" fill="#102f3a" stroke="#315460"/><text x="424.7" y="222" class="metric">5</text><text x="424.7" y="252" class="metric-label">Linked events</text>
<rect x="749.3" y="174" width="332.7" height="106" rx="12" fill="#102f3a" stroke="#315460"/><text x="771.3" y="222" class="metric">3</text><text x="771.3" y="252" class="metric-label">Findings</text>
