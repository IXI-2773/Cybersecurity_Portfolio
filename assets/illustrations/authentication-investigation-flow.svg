<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="230" viewBox="0 0 1080 230" role="img" aria-labelledby="t d"><title id="t">Authentication detection investigation workflow</title><desc id="d">Illustration of the four steps used in the synthetic authentication lab</desc>
<defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#122f40"/><stop offset="1" stop-color="#081927"/></linearGradient><linearGradient id="highlight" x2="1"><stop stop-color="#5eddbf"/><stop offset="1" stop-color="#81c5f5"/></linearGradient></defs>
<rect width="1080" height="230" rx="18" fill="url(#back)"/><rect x="1" y="1" width="1078" height="228" rx="17" fill="none" stroke="#35647c"/>
<text x="27" y="35" fill="#88c8d7" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2">DETECTION INVESTIGATION · ILLUSTRATION</text>
<g font-family="Arial,sans-serif">
<g transform="translate(27 66)"><rect width="235" height="126" rx="12" fill="#102a39" stroke="#4b7387"/><circle cx="28" cy="31" r="12" fill="#69dac2"/><text x="28" y="35" fill="#09202d" text-anchor="middle" font-size="12" font-weight="bold">1</text><text x="48" y="36" fill="#e8f5f8" font-weight="bold" font-size="19">Review events</text><text x="20" y="71" fill="#b7d0dc" font-size="14">Account, IP, event time</text><text x="20" y="93" fill="#b7d0dc" font-size="14">and event outcome</text></g>
<path d="M266 128h27m-10-8 10 8-10 8" fill="none" stroke="#74dfca" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(301 66)"><rect width="235" height="126" rx="12" fill="#102a39" stroke="#4b7387"/><circle cx="28" cy="31" r="12" fill="#69dac2"/><text x="28" y="35" fill="#09202d" text-anchor="middle" font-size="12" font-weight="bold">2</text><text x="48" y="36" fill="#e8f5f8" font-weight="bold" font-size="19">Correlate</text><text x="20" y="71" fill="#b7d0dc" font-size="14">5 failures + success</text><text x="20" y="93" fill="#b7d0dc" font-size="14">same user and IP</text></g>
<path d="M540 128h27m-10-8 10 8-10 8" fill="none" stroke="#74dfca" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(575 66)"><rect width="235" height="126" rx="12" fill="#102a39" stroke="#4b7387"/><circle cx="28" cy="31" r="12" fill="#69dac2"/><text x="28" y="35" fill="#09202d" text-anchor="middle" font-size="12" font-weight="bold">3</text><text x="48" y="36" fill="#e8f5f8" font-weight="bold" font-size="19">Test boundary</text><text x="20" y="71" fill="#b7d0dc" font-size="14">Inclusive 0–600 sec</text><text x="20" y="93" fill="#b7d0dc" font-size="14">rule and negative cases</text></g>
<path d="M814 128h27m-10-8 10 8-10 8" fill="none" stroke="#74dfca" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(849 66)"><rect width="204" height="126" rx="12" fill="#102a39" stroke="#4b7387"/><circle cx="27" cy="31" r="12" fill="#69dac2"/><text x="27" y="35" fill="#09202d" text-anchor="middle" font-size="12" font-weight="bold">4</text><text x="47" y="36" fill="#e8f5f8" font-weight="bold" font-size="19">Document</text><text x="20" y="71" fill="#b7d0dc" font-size="14">Findings, limits,</text><text x="20" y="93" fill="#b7d0dc" font-size="14">analyst next steps</text></g>
</g></svg>