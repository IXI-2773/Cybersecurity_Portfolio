name: Verify live GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'explore.html'
      - 'projects/*.html'
      - 'styles.css'
      - 'portfolio.css'
      - 'resumes/*.pdf'
      - 'assets/network/*.svg'
      - 'assets/evidence/*.png'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/check_live_site.py'
      - '.github/workflows/check-live-pages.yml'
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * 1'

permissions:
  contents: read

jobs:
  live-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline response validator
        run: python scripts/check_live_site.py --self-test
      - name: Check published homepage, all seven case studies and shared assets
        run: python scripts/check_live_site.py
