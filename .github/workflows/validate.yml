name: Validate public portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authentication detection tests (31)
        run: python -m unittest discover -s projects/01-authentication-detection -p 'test_*.py' -v
      - name: Independent synthetic SOC validation matrix
        run: python projects/01-authentication-detection/validate_matrix.py
      - name: Windows process triage tests (11)
        run: python -m unittest discover -s projects/02-windows-process-triage -p 'test_*.py' -v
      - name: Network PCAP tests (18)
        run: python -m unittest discover -s projects/03-network-pcap -p 'test_*.py' -v
      - name: Generate and inspect synthetic PCAP
        run: |
          python projects/03-network-pcap/generate_fixture.py --output projects/03-network-pcap/synthetic_traffic.pcap
          python projects/03-network-pcap/analyze_pcap.py projects/03-network-pcap/synthetic_traffic.pcap
      - name: Attach generated PCAP for Wireshark review
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-network-pcap
          path: projects/03-network-pcap/synthetic_traffic.pcap
          retention-days: 7
      - name: Validate static network figures and disclosure labels
        run: python scripts/verify_network_visuals.py
      - name: Local vulnerability assessment tests (16)
        run: python -m unittest discover -s projects/04-local-vulnerability-assessment -p 'test_*.py' -v
      - name: Verify vulnerable versus remediated fixture
        run: python projects/04-local-vulnerability-assessment/audit_demo.py
      - name: Check local HTML links
        run: python scripts/check_links.py
