name: Validate public portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public browser engine and fixture provenance
        run: |
          python scripts/build_browser_fixture.py --check
          node scripts/test_browser_engine.cjs
          node scripts/test_portfolio_systems.cjs
          python scripts/build_technical_fixture.py --check
          python scripts/build_research_fixture.py --check
          python -m unittest discover -s scripts -p "test_technical_fixture.py"
          node scripts/test_detection_lab.cjs
          node scripts/test_research_workbenches.cjs
      - name: Test exported-log triage and reproduce retained execution
        run: |
          python -m unittest discover -s projects/10-soc-triage -p 'test_*.py' -v
          python projects/10-soc-triage/run_demo.py --check
      - name: Authentication detection tests (31)
        run: python -m unittest discover -s projects/01-authentication-detection -p 'test_*.py' -v
      - name: Independent synthetic SOC validation matrix
        run: python projects/01-authentication-detection/validate_matrix.py
      - name: Windows process triage tests (11)
        run: python -m unittest discover -s projects/02-windows-process-triage -p 'test_*.py' -v
      - name: Network PCAP tests (18)
        run: python -m unittest discover -s projects/03-network-pcap -p 'test_*.py' -v
      - name: Generate and inspect synthetic PCAP
        run: |
          python projects/03-network-pcap/generate_fixture.py --output projects/03-network-pcap/synthetic_traffic.pcap
          python projects/03-network-pcap/analyze_pcap.py projects/03-network-pcap/synthetic_traffic.pcap
      - name: Attach generated PCAP for Wireshark review
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-network-pcap
          path: projects/03-network-pcap/synthetic_traffic.pcap
          retention-days: 7
      - name: Validate static network figures and disclosure labels
        run: python scripts/verify_network_visuals.py
      - name: Local vulnerability assessment tests (16)
        run: python -m unittest discover -s projects/04-local-vulnerability-assessment -p 'test_*.py' -v
      - name: Verify vulnerable versus remediated fixture
        run: python projects/04-local-vulnerability-assessment/audit_demo.py
      - name: Audit site accessibility structure and navigation
        run: python scripts/check_accessibility.py
      - name: Verify published case-study claims against frozen evidence
        run: python scripts/check_case_evidence.py
      - name: Validate Splunk integration source and safe disabled alert
        run: |
          python -m unittest discover -s splunk_workflow -p 'test_*.py' -v
          python scripts/check_splunk_workflow.py
          python scripts/build_splunk_app.py --output don_lopez_soc.spl
      - name: Attach installable synthetic Splunk SOC app package
        uses: actions/upload-artifact@v4
        with:
          name: don-lopez-splunk-soc-app
          path: don_lopez_soc.spl
          retention-days: 30
      - name: Validate genuine Splunk screenshot PNG integrity
        run: python scripts/verify_splunk_screenshot.py
      - name: Test deployment-response checker offline
        run: python scripts/check_live_site.py --self-test
      - name: Check local HTML links
        run: python scripts/check_links.py
      - name: Build downloadable offline website preview
        run: python scripts/build_site_bundle.py --output cybersecurity-portfolio-site.zip
      - name: Attach browser-ready portfolio website archive
        uses: actions/upload-artifact@v4
        with:
          name: cybersecurity-portfolio-site
          path: cybersecurity-portfolio-site.zip
          retention-days: 30
