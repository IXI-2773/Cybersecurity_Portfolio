name: Review responsive website in Chrome

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'explore.html'
      - 'awards.html'
      - 'education.html'
      - 'visual-credits.html'
      - 'assets/reference/**'
      - 'test-lab.html'
      - 'assets/js/**'
      - 'assets/evidence/**'
      - 'assets/animation/**'
      - 'index.html'
      - 'resume-*.html'
      - 'apply.html'
      - 'recruiter.html'
      - 'styles.css'
      - 'portfolio.css'
      - 'resumes/**'
      - 'projects/*.html'
      - 'projects/08-ad-investigation/**'
      - 'scripts/test_technical_workbenches_browser.py'
      - 'scripts/visual_review.py'
      - '.github/workflows/visual-review.yml'
  push:
    branches: [main]
    paths:
      - 'explore.html'
      - 'awards.html'
      - 'education.html'
      - 'visual-credits.html'
      - 'assets/reference/**'
      - 'test-lab.html'
      - 'assets/js/**'
      - 'assets/evidence/**'
      - 'assets/animation/**'
      - 'index.html'
      - 'styles.css'
      - 'portfolio.css'
      - 'resumes/**'
      - 'projects/*.html'
      - 'projects/08-ad-investigation/**'
      - 'scripts/test_technical_workbenches_browser.py'
      - '.github/workflows/visual-review.yml'
      - 'scripts/visual_review.py'

permissions:
  contents: read

jobs:
  responsive-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight browser driver library
        run: python -m pip install 'selenium==4.36.0' 'pypdf==5.9.0'
      - name: Verify recorded AD analysis and generated evidence
        run: |
          python -m unittest discover -s projects/08-ad-investigation -p 'test_*.py'
          python projects/08-ad-investigation/analyze.py --source-dir /tmp/portfolio-ad-source --download --check
      - name: Verify technical workbench controls and evidence
        run: python scripts/test_technical_workbenches_browser.py
      - name: Capture responsive screenshots and test keyboard menu and page overflow
        run: python scripts/visual_review.py
      - name: Upload browser screenshots and review summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-website-review
          path: visual-review-screenshots/
          retention-days: 14
          if-no-files-found: ignore
