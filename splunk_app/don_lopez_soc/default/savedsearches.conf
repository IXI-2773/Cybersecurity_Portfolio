[Portfolio SOC Auth Candidate - Indexed (DISABLED)]
description = Deliberately disabled synthetic-lab search. Requires authorized index lab_auth, sourcetype portfolio:auth, fresh events and analyst review. Not production approved.
search = index=lab_auth sourcetype="portfolio:auth" | where event_type="login_failure" OR event_type="login_success" | eval _time=strptime(replace(timestamp,"Z$","+0000"),"%Y-%m-%dT%H:%M:%S%z") | where isnotnull(_time) AND isnotnull(username) AND isnotnull(source_ip) | sort 0 _time | streamstats current=f count(eval(event_type="login_success")) as prior_successes by username source_ip | fillnull value=0 prior_successes | eval failure_epoch=if(event_type="login_failure",_time,null()) | streamstats current=f list(failure_epoch) as prior_failure_times by username source_ip prior_successes | eval age_seconds=mvmap(prior_failure_times,_time-tonumber(prior_failure_times)) | eval eligible_ages=mvfilter(isnotnull(age_seconds) AND age_seconds>=0 AND age_seconds<=600) | eval failure_count_in_window=coalesce(mvcount(eligible_ages),0) | where event_type="login_success" AND failure_count_in_window>=5 | where _time>=relative_time(now(),"-5m") | table timestamp username source_ip host scenario failure_count_in_window
disabled = 1
enableSched = 0
cron_schedule = 2,7,12,17,22,27,32,37,42,47,52,57 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
action.email = 0
action.script = 0
